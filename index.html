<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>1win - Gire e ganhe 500% de Bônus!</title>
    <meta name="description" content="Gire a roleta agora e ganhe um super bônus de cassino na 1win"/>
    <!-- Tailwind CSS للتنسيق السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .roulette-box {
            position: relative;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(30,41,59,1) 0%, rgba(15,23,42,1) 100%);
            border: 4px solid #eab308;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.4);
            transition: transform 1s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Header / Logos -->
        <header class="w-full flex flex-col items-center mt-4 mb-6 text-center">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-3xl font-black tracking-wider text-yellow-400 italic">1<span class="text-blue-500">WIN</span></span>
            </div>
            <h1 class="text-xl md:text-2xl font-black uppercase text-white tracking-wide">
                Garanta seu bônus de <span class="text-yellow-400">500%</span> agora!
            </h1>
        </header>

        <!-- Main Interactive Wheel / Content Section -->
        <main class="w-full flex flex-col items-center relative">
            
            <!-- Tries Count -->
            <div id="tries-display" class="bg-slate-800 border border-slate-700 px-4 py-1 rounded-full text-xs font-bold text-yellow-400 mb-6 shadow-inner">
                2 tentativas restantes
            </div>

            <!-- Roulette Wheel Component -->
            <div id="wheel-card" class="roulette-box p-6 text-center">
                
                <!-- State 1: Initial Spin Screen -->
                <div id="screen-start" class="flex flex-col items-center">
                    <div class="text-4xl mb-3 animate-pulse">🎰</div>
                    <p class="text-xs text-gray-300 mb-6 px-4">Gire a roleta da sorte para desbloquear seu prêmio exclusivo na 1win.</p>
                    <button onclick="executeSpin()" class="bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-black px-6 py-3 rounded-xl shadow-lg uppercase text-sm tracking-wider transform active:scale-95 transition-all">
                        GIRAR AGORA 🚀
                    </button>
                </div>

                <!-- State 2: Win Result Screen -->
                <div id="screen-win" class="hidden flex flex-col items-center w-full px-2">
                    <span class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold mb-1">Resultado da Sorte</span>
                    <div class="text-2xl font-black text-yellow-400 my-1 drop-shadow">500% DE BÔNUS</div>
                    <p class="text-[11px] text-gray-300 mb-4">+ Giros Grátis no Cassino</p>
                    
                    <!-- Promo Code Box -->
                    <div class="bg-slate-950/90 border border-yellow-500/50 px-3 py-2 rounded-lg w-full mb-3 flex items-center justify-between">
                        <span class="text-[11px] text-gray-400 font-semibold">Cód. Promo:</span>
                        <span class="text-yellow-400 font-black text-sm tracking-widest select-all">THERECH21</span>
                    </div>

                    <!-- CTA Button -->
                    <a href="https://lkhe.cc/6ea631" target="_blank" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-slate-950 font-black py-3 rounded-xl shadow-lg text-center uppercase tracking-wider text-xs transition-all transform hover:scale-105">
                        RESGATAR AGORA 💰
                    </a>
                </div>

            </div>
        </main>
    </div>

    <!-- Script to Handle Spin and Display -->
    <script>
        let remainingTries = 2;

        function executeSpin() {
            if (remainingTries <= 0) return;
            
            remainingTries--;
            document.getElementById('tries-display').innerText = remainingTries + ' tentativa restante';

            const wheel = document.getElementById('wheel-card');
            const startScreen = document.getElementById('screen-start');
            const winScreen = document.getElementById('screen-win');

            // Spin animation
            wheel.style.transform = "rotate(720deg) scale(1.03)";
            wheel.style.transition = "transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)";

            setTimeout(() => {
                wheel.style.transform = "rotate(0deg) scale(1)";
                startScreen.classList.add('hidden');
                winScreen.classList.remove('hidden');
            }, 700);
        }
    </script>
</body>
</html>
