<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <style>
        body {

            margin: 0;

        }
        .page_page__NsjYD {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;

        }
        .header_header__w2BOs {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }
        .roulette_roulette__YWWxD {

            align-items: center;
            position: relative;
        }
        .roulette_borderContainer__a0p_Q {
            position: relative;
            width: 320px;
            height: 320px;
            border: 4px solid #facc15;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #192237 0%, #0c1017 100%);
            box-shadow: 0 0 35px rgba(250, 204, 21, 0.3);
            transition: transform 0.8s ease-in-out;
        }
    </style>
</head>
<body>

<div class="page_page__NsjYD">
    <header class="header_header__w2BOs">
        <!-- Logo / Brand -->
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
            <span style="font-size: 28px; font-weight: 900; font-style: italic; color: #facc15; letter-spacing: 1px;">1<span style="color: #3b82f6;">WIN</span></span>
        </div>
        <h1 style="font-size: 22px; font-weight: 900; text-transform: uppercase; margin: 0; line-height: 1.3;">
            Garanta seu bônus de <span style="color: #facc15;">500%</span> agora!
        </h1>
    </header>

    <main class="roulette_roulette__YWWxD">
        <!-- Tries Counter -->
        <div id="tries-left" style="background: #192237; border: 1px solid #334155; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #facc15; margin-bottom: 20px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);">
            2 tentativas restantes
        </div>

        <!-- Wheel Box Wrapper -->
        <div id="roulette-box" class="roulette_borderContainer__a0p_Q">
            
            <!-- State 1: Initial Wheel Action -->
            <div id="view-initial" style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px;">
                <div style="font-size: 42px; margin-bottom: 12px; animation: bounce 1.5s infinite;">🎰</div>
                <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.4;">
                    Gire a roleta agora e desbloqueie sua recompensa de bônus exclusiva.
                </p>
                <button onclick="spinAction()" style="background: linear-gradient(90deg, #eab308 0%, #d97706 100%); color: #030712; font-weight: 900; padding: 12px 28px; border-radius: 12px; border: none; font-size: 13px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 12px rgba(234, 179, 8, 0.4); transition: transform 0.1s;">
                    GIRAR AGORA 🚀
                </button>
            </div>

            <!-- State 2: Win Result Display -->
            <div id="view-win" style="display: none; flex-direction: column; align-items: center; text-align: center; width: 100%; padding: 0 15px; box-sizing: border-box;">
                <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #34d399; font-weight: 700; margin-bottom: 2px;">Parabéns! Você ganhou:</span>
                <div style="font-size: 24px; font-weight: 900; color: #facc15; margin: 4px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">500% DE BÔNUS</div>
                <p style="font-size: 11px; color: #94a3b8; margin-bottom: 14px;">+ Giros Grátis no Cassino</p>
                
                <!-- Promo Code Section -->
                <div style="background: #06090f; border: 1px solid rgba(250, 204, 21, 0.3); padding: 8px 12px; border-radius: 8px; width: 100%; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box;">
                    <span style="font-size: 11px; color: #94a3b8; font-weight: 600;">Cód. Promo:</span>
                    <span style="color: #facc15; font-weight: 900; font-size: 13px; letter-spacing: 1px; user-select: all;">THERECH21</span>
                </div>

                <!-- Final Action Button -->
                <a href="https://lkhe.cc/6ea631" target="_blank" style="display: block; width: 100%; background: linear-gradient(90deg, #10b981 0%, #059669 100%); color: #030712; font-weight: 900; padding: 12px 0; border-radius: 12px; text-decoration: none; text-transform: uppercase; font-size: 12px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); transition: transform 0.2s;">
                    RESGATAR BÔNUS 💰
                </a>
            </div>

        </div>
    </main>
</div>

<script>
    let tries = 2;

    function spinAction() {
        if (tries <= 0) return;
        
        tries--;
        document.getElementById('tries-left').innerText = tries + ' tentativa restante';

        const wheelBox = document.getElementById('roulette-box');
        const viewInitial = document.getElementById('view-initial');
        const viewWin = document.getElementById('view-win');

        // Animation effect
        wheelBox.style.transform = "rotate(720deg) scale(1.02)";

        setTimeout(() => {
            wheelBox.style.transform = "rotate(0deg) scale(1)";
            viewInitial.style.display = 'none';
            viewWin.style.display = 'flex';
        }, 750);
    }
</script>

</body>
</html>
